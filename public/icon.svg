<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141E1A"/>
      <stop offset="100%" stop-color="#070A09"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D89F"/>
      <stop offset="45%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#8B6220"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Herbarium Background -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#brassGrad)" stroke-width="3" stroke-opacity="0.4"/>
  <rect width="472" height="472" x="20" y="20" rx="92" fill="none" stroke="url(#brassGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 4"/>

  <!-- Archival Compass & Celestial Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#brassGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#brassGrad)" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="56" x2="256" y2="76" stroke="url(#brassGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="456" stroke="url(#brassGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="256" x2="76" y2="256" stroke="url(#brassGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="456" y2="256" stroke="url(#brassGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Monarch / Majestic Fauna Lion & Flora Crest -->
  <g id="crest" filter="url(#goldGlow)">
    <!-- Crown / Tiara of the Animal Kingdom -->
    <path d="M 206 142 L 226 172 L 256 132 L 286 172 L 306 142 L 298 192 L 214 192 Z" fill="url(#brassGrad)" opacity="0.95"/>
    <circle cx="256" cy="122" r="5" fill="url(#brassGrad)"/>
    <circle cx="204" cy="132" r="4" fill="url(#brassGrad)"/>
    <circle cx="308" cy="132" r="4" fill="url(#brassGrad)"/>

    <!-- Noble Lion Profile / Mask -->
    <path d="M 256 195 
             C 215 195 185 225 185 268 
             C 185 298 200 326 226 348 
             L 242 366 
             L 256 376 
             L 270 366 
             L 286 348 
             C 312 326 327 298 327 268 
             C 327 225 297 195 256 195 Z" 
          fill="none" stroke="url(#brassGrad)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Lion Mane Geometric Flares -->
    <path d="M 185 235 C 160 250 148 285 160 315 C 168 335 184 352 204 366" fill="none" stroke="url(#brassGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 327 235 C 352 250 364 285 352 315 C 344 335 328 352 308 366" fill="none" stroke="url(#brassGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Eyes & Muzzle -->
    <path d="M 226 256 L 244 262" stroke="url(#brassGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 286 256 L 268 262" stroke="url(#brassGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Nose & Whisker Plate -->
    <polygon points="256,288 246,276 266,276" fill="url(#brassGrad)"/>
    <path d="M 256 288 L 256 312 M 256 312 C 248 316 238 316 232 310 M 256 312 C 264 316 274 316 280 310" stroke="url(#brassGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Laurel / Botanical Branches of Linnaeus -->
    <path d="M 152 390 C 180 422 220 436 256 436 C 292 436 332 422 360 390" fill="none" stroke="url(#brassGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <!-- Laurel Leaves -->
    <path d="M 166 384 C 158 376 154 362 162 356 C 170 358 174 372 166 384 Z" fill="url(#brassGrad)" opacity="0.7"/>
    <path d="M 196 406 C 188 400 186 386 196 382 C 204 386 206 400 196 406 Z" fill="url(#brassGrad)" opacity="0.7"/>
    <path d="M 346 384 C 354 376 358 362 350 356 C 342 358 338 372 346 384 Z" fill="url(#brassGrad)" opacity="0.7"/>
    <path d="M 316 406 C 324 400 326 386 316 382 C 308 386 306 400 316 406 Z" fill="url(#brassGrad)" opacity="0.7"/>
  </g>

  <!-- Typography: ANIMALIA Archival Field Monograph -->
  <text x="256" y="478" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="28" font-weight="600" letter-spacing="8" fill="url(#brassGrad)">ANIMALIA</text>
</svg>
